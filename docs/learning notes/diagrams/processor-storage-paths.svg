<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Processor to storage — all interaction paths</title>
  <desc>Every call the processor makes to storage and every possible return: BALANCE via get_balance returns a balance (SUCCESS) or None (FAILED, NOT_FOUND); DEPOSIT/WITHDRAW via apply_transaction returns a committed TxnResult, opens the account on a deposit to a new account, or raises InsufficientFunds, AccountNotFound (business results) or ValueError (a fault mapped to ERROR).</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="480" fill="#FFFFFF"/>

  <text x="20" y="22" font-size="13" font-weight="600" fill="#1F1F1F">Processor ↔ Storage — all paths (T-P3)</text>

  <!-- lifelines -->
  <rect x="60" y="38" width="140" height="38" rx="8" fill="#EDE7F6" stroke="#7E57C2" stroke-width="1"/>
  <text x="130" y="61" font-size="12" font-weight="600" fill="#1F1F1F" text-anchor="middle">Processor</text>
  <rect x="370" y="38" width="140" height="38" rx="8" fill="#E0F2F1" stroke="#26A69A" stroke-width="1"/>
  <text x="440" y="61" font-size="12" font-weight="600" fill="#1F1F1F" text-anchor="middle">Storage</text>
  <line x1="130" y1="76" x2="130" y2="440" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="440" y1="76" x2="440" y2="440" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- BALANCE -->
  <text x="60" y="102" font-size="11" font-weight="600" fill="#1F1F1F">BALANCE</text>
  <text x="285" y="116" font-size="10" fill="#5A5A5A" text-anchor="middle">get_balance(account_id)</text>
  <line x1="130" y1="122" x2="438" y2="122" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar)"/>

  <rect x="66" y="134" width="562" height="52" rx="4" fill="none" stroke="#CFCFCF" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="66" y="134" width="32" height="14" rx="3" fill="#EEEEEE" stroke="#9E9E9E" stroke-width="0.75"/>
  <text x="82" y="144" font-size="9" fill="#5A5A5A" text-anchor="middle">alt</text>
  <text x="285" y="156" font-size="10" fill="#5A5A5A" text-anchor="middle">[exists] balance ⇒ SUCCESS</text>
  <line x1="440" y1="162" x2="132" y2="162" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="285" y="174" font-size="10" fill="#5A5A5A" text-anchor="middle">[unknown] None ⇒ FAILED · NOT_FOUND</text>
  <line x1="440" y1="180" x2="132" y2="180" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- WRITE -->
  <text x="60" y="212" font-size="11" font-weight="600" fill="#1F1F1F">DEPOSIT / WITHDRAW</text>
  <text x="285" y="228" font-size="10" fill="#5A5A5A" text-anchor="middle">apply_transaction(txn_id, …)</text>
  <line x1="130" y1="234" x2="438" y2="234" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar)"/>
  <path d="M440 246 L486 246 L486 260 L442 260" fill="none" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar)"/>
  <text x="492" y="257" font-size="10" fill="#5A5A5A">atomic write-ahead</text>

  <rect x="66" y="276" width="562" height="158" rx="4" fill="none" stroke="#CFCFCF" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="66" y="276" width="32" height="14" rx="3" fill="#EEEEEE" stroke="#9E9E9E" stroke-width="0.75"/>
  <text x="82" y="286" font-size="9" fill="#5A5A5A" text-anchor="middle">alt</text>

  <text x="285" y="300" font-size="10" fill="#5A5A5A" text-anchor="middle">[exists · ok] TxnResult ⇒ SUCCESS</text>
  <line x1="440" y1="306" x2="132" y2="306" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <text x="285" y="326" font-size="10" fill="#5A5A5A" text-anchor="middle">[deposit · new acct] opens account ⇒ SUCCESS</text>
  <line x1="440" y1="332" x2="132" y2="332" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <text x="285" y="352" font-size="10" fill="#5A5A5A" text-anchor="middle">[withdraw &gt; funds] ✗ InsufficientFunds ⇒ FAILED · INSUFFICIENT_FUNDS</text>
  <line x1="440" y1="358" x2="132" y2="358" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <text x="285" y="378" font-size="10" fill="#5A5A5A" text-anchor="middle">[withdraw · unknown acct] ✗ AccountNotFound ⇒ FAILED · NOT_FOUND</text>
  <line x1="440" y1="384" x2="132" y2="384" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <text x="285" y="404" font-size="10" fill="#5A5A5A" text-anchor="middle">[amount &lt; 0 · BALANCE here] ✗ ValueError ⇒ raises → ERROR (§7.4)</text>
  <line x1="440" y1="410" x2="132" y2="410" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- legend -->
  <line x1="66" y1="458" x2="92" y2="458" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="98" y="462" font-size="10" fill="#5A5A5A">success</text>
  <line x1="180" y1="458" x2="206" y2="458" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="212" y="462" font-size="10" fill="#5A5A5A">business result (FAILED) — never the ERROR channel</text>
  <line x1="500" y1="458" x2="526" y2="458" stroke="#BA7517" stroke-width="1.5"/>
  <text x="532" y="462" font-size="10" fill="#5A5A5A">fault → ERROR</text>
</svg>
