<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>CICS recovery identity — how a UOWID resolves an in-doubt unit of work</title>
  <desc>The coordinator sends prepare for UOWID U; the resource manager hardens its log and votes yes; the coordinator crashes before sending the verdict. The resource manager is in-doubt, holding locks, unable to decide alone. After restart the coordinator reads its log; the resource manager resynchronizes by asking what happened to UOWID U, is told it committed, and completes.</desc>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>

  <text x="20" y="22" font-size="13" font-weight="600" fill="#1F1F1F">CICS recovery identity — the in-doubt window, resolved by UOWID</text>

  <rect x="50" y="40" width="180" height="38" rx="8" fill="#EDE7F6" stroke="#7E57C2" stroke-width="1"/>
  <text x="140" y="63" font-size="12" font-weight="600" fill="#1F1F1F" text-anchor="middle">CICS (coordinator)</text>
  <rect x="440" y="40" width="190" height="38" rx="8" fill="#E0F2F1" stroke="#26A69A" stroke-width="1"/>
  <text x="535" y="63" font-size="12" font-weight="600" fill="#1F1F1F" text-anchor="middle">Resource manager (Db2)</text>
  <line x1="140" y1="78" x2="140" y2="430" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="535" y1="78" x2="535" y2="430" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="337" y="108" font-size="10" fill="#5A5A5A" text-anchor="middle">prepare (UOWID = U)</text>
  <line x1="140" y1="116" x2="533" y2="116" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar2)"/>

  <path d="M535 128 L586 128 L586 142 L537 142" fill="none" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar2)"/>
  <text x="592" y="139" font-size="10" fill="#5A5A5A">harden log</text>

  <text x="337" y="162" font-size="10" fill="#5A5A5A" text-anchor="middle">vote yes — I can commit U</text>
  <line x1="535" y1="170" x2="142" y2="170" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar2)"/>

  <rect x="60" y="190" width="160" height="32" rx="6" fill="#FBE9E7" stroke="#A32D2D" stroke-width="1"/>
  <text x="140" y="210" font-size="11" font-weight="600" fill="#1F1F1F" text-anchor="middle">crash — verdict unsent</text>

  <rect x="330" y="192" width="300" height="76" rx="4" fill="#FFF8F8" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="480" y="214" font-size="11" font-weight="600" fill="#1F1F1F" text-anchor="middle">in-doubt window</text>
  <text x="480" y="234" font-size="10" fill="#5A5A5A" text-anchor="middle">voted yes · verdict unknown · locks held</text>
  <text x="480" y="252" font-size="10" fill="#5A5A5A" text-anchor="middle">cannot decide alone — guessing risks</text>
  <text x="480" y="264" font-size="10" fill="#5A5A5A" text-anchor="middle">a lost or duplicated commit</text>

  <rect x="60" y="288" width="160" height="32" rx="6" fill="#EEEEEE" stroke="#9E9E9E" stroke-width="1"/>
  <text x="140" y="308" font-size="11" font-weight="600" fill="#1F1F1F" text-anchor="middle">restart · read log</text>

  <text x="337" y="346" font-size="10" fill="#5A5A5A" text-anchor="middle">resync: what happened to UOWID U?</text>
  <line x1="535" y1="354" x2="142" y2="354" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar2)"/>

  <text x="337" y="380" font-size="10" fill="#5A5A5A" text-anchor="middle">U was committed</text>
  <line x1="140" y1="388" x2="533" y2="388" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar2)"/>

  <path d="M535 400 L586 400 L586 414 L537 414" fill="none" stroke="#5A5A5A" stroke-width="1" marker-end="url(#ar2)"/>
  <text x="592" y="411" font-size="10" fill="#5A5A5A">commit · free locks</text>

  <text x="20" y="452" font-size="10" fill="#5A5A5A">The stable UOWID is what makes the resync question askable — without a durable name for the unit of work, "what happened to U?" has no referent.</text>
</svg>
