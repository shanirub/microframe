name: CI

# Runs on every push (any branch, any commit) and on pull requests.
# Public repo -> GitHub-hosted runner minutes are free and uncapped, so three
# separate jobs (running in parallel, each with its own pass/fail status) cost
# nothing and give clearer feedback than one job with three sequential steps.
on:
  push:
  pull_request:

defaults:
  run:
    # pyproject.toml lives at code/pi/, not the repo root
    working-directory: code/pi

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy
